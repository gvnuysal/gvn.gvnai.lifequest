# LifeQuest test ortamı: bu makinedeki Docker üzerinde Caddy (HTTPS) + web + api + postgres.
# Doğrudan değil, deploy.sh ile kullanılır:  deploy/test/deploy.sh
# Elle:  docker compose -p lifequest-test -f deploy/test/docker-compose.yml --env-file ~/.lifequest-test/.env up -d
name: lifequest-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifequest
      POSTGRES_USER: lifequest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı olmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifequest -d lifequest"]
      interval: 5s
      retries: 12
    restart: unless-stopped
    # Host portu yok: veritabanına yalnızca api erişir. İncelemek için: docker compose ... exec postgres psql -U lifequest

  api:
    image: lifequest-api:${IMAGE_TAG:-current}
    build:
      context: ../..
      dockerfile: src/LifeQuest.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__LifeQuest: "Host=postgres;Port=5432;Database=lifequest;Username=lifequest;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET tanımlı olmalı}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: https://${UI_HOST}
      ReverseProxy__Enabled: "true"
      ApiDocs__Enabled: "true"
      Admin__BootstrapEmails__0: ${ADMIN_EMAIL:-}
    restart: unless-stopped

  web:
    image: lifequest-web:${IMAGE_TAG:-current}
    build:
      context: ../../src/LifeQuest.Web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      API_BASE_URL: https://${API_HOST}
      API_ORIGIN: https://${API_HOST}
    restart: unless-stopped

  # Tek giriş kapısı: iki alan adı için HTTPS ve yönlendirme.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      UI_HOST: ${UI_HOST:?UI_HOST tanımlı olmalı}
      API_HOST: ${API_HOST:?API_HOST tanımlı olmalı}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
