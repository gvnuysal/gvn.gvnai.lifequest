  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- Kategori renk noktaları -->
  <g opacity="0.9">
    <circle cx="1030" cy="70" r="16" fill="#0F9B9B"/>
    <circle cx="1090" cy="120" r="11" fill="#8B5CF6"/>
    <circle cx="1128" cy="62" r="8" fill="#3B82F6"/>
    <circle cx="985" cy="300" r="12" fill="#EC4899"/>
    <circle cx="1060" cy="280" r="9" fill="#22A559"/>
    <circle cx="1120" cy="250" r="14" fill="#F97316"/>
  </g>

  <!-- Uygulama ikonu -->
  <g transform="translate(90 90)">
    <rect width="180" height="180" rx="40" fill="#F26B4F"/>
    <circle cx="90" cy="90" r="53" fill="none" stroke="#FFF8F1" stroke-width="10" stroke-dasharray="246 88" stroke-linecap="round" transform="rotate(-90 90 90)"/>
    <path d="M90 53 L100 80 L128 81 L106 99 L114 126 L90 110 L66 126 L74 99 L52 81 L80 80 Z" fill="#FFD166"/>
  </g>

  <text x="320" y="165" font-size="76" font-weight="900" fill="#2B2238">LifeQuest</text>
