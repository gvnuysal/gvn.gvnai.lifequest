<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Nunito, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1E6"/>
      <stop offset="0.55" stop-color="#FFE3D3"/>
      <stop offset="1" stop-color="#FFE9B8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#F26B4F"/>
      <stop offset="1" stop-color="#F5A623"/>
