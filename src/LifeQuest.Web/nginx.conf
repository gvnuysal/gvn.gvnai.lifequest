# LifeQuest web: SPA + API ters proxy. Tarayıcı yalnızca bu kökle konuşur (CORS gerekmez).
upstream lifequest_api {
    server api:8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf.inc;

    location /api/ {
        proxy_pass http://lifequest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://lifequest_api;
        proxy_set_header Host $host;
    }

    # Service worker ve uygulama kabuğu her zaman taze okunur; aksi halde yeni sürüm yayılmaz.
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf.inc;
        try_files $uri =404;
    }

    # Adı içerik özetini taşıyan derleme çıktıları uzun süre önbelleğe alınabilir.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf.inc;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
