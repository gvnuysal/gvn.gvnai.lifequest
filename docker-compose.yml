# Yerel geliştirme altyapısı: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: lifequest-postgres
    environment:
      POSTGRES_DB: lifequest
      POSTGRES_USER: lifequest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifequest}
    ports:
      - "5433:5432"
    volumes:
      - lifequest-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifequest -d lifequest"]
      interval: 5s
      retries: 10

  # Opsiyonel: Cache:UseRedis=true ile kullanılır → docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: lifequest-redis
    profiles: ["redis"]
    ports:
      - "6380:6379"

  # Tam uygulama: cp .env.example .env && docker compose --profile app up -d --build → http://localhost:8081
  api:
    build:
      context: .
      dockerfile: src/LifeQuest.Api/Dockerfile
    container_name: lifequest-api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__LifeQuest: "Host=postgres;Port=5432;Database=lifequest;Username=lifequest;Password=${POSTGRES_PASSWORD:-lifequest}"
      Jwt__Secret: "${JWT_SECRET:?JWT_SECRET .env dosyasında tanımlı olmalı}"
      Database__MigrateOnStartup: "true"
      Admin__BootstrapEmails__0: "${ADMIN_EMAIL:-}"
      ReverseProxy__Enabled: "true"
    restart: unless-stopped

  web:
    build:
      context: src/LifeQuest.Web
      dockerfile: Dockerfile
    container_name: lifequest-web
    profiles: ["app"]
    depends_on:
      - api
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  lifequest-pg:
